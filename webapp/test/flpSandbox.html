<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPL Hit Adjudication - FLP Sandbox</title>
    <script>
        window["sap-ushell-config"] = {
            defaultRenderer: "fiori2",
            bootstrapPlugins: {},
            renderers: {
                fiori2: {
                    componentData: {
                        config: {
                            enableSearch: false,
                            rootIntent: "Shell-home"
                        }
                    }
                }
            },
            applications: {
                "SPLAdjudication-display": {
                    title: "SPL Hit Adjudication",
                    description: "Review and disposition screening hits",
                    additionalInformation: "SAPUI5.Component=zpwc.gts.spladjudication",
                    applicationType: "URL",
                    url: "../",
                    navigationMode: "embedded"
                }
            }
        };
    </script>
    <script id="sap-ui-bootstrap"
        src="../resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resourceroots='{
            "zpwc.gts.spladjudication": "../"
        }'
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="allow">
    </script>
    <script src="../test-resources/sap/ushell/bootstrap/sandbox.js"></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
</body>
</html>
